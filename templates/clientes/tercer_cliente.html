<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django - Clientes</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col">
                <h1>Tercer Cliente</h1>
                <hr>
                <div class="card" style="width: 18rem;">
                    <img src="{% static 'images/vincent.png' %}" class="card-img-top" alt="foto de {{ nombre }} {{ apellido }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ nombre }} {{ apellido }}</h5>
                        <p class="card-text">
                            <ul>
                                <li>Correo: {{ correo }}</li>
                                <li>Cargo: {{ cargo }}</li>
                                <li>Dirección: {{ direccion }}</li>
                                <li>Saldo: ${{ saldo }}</li>
                            </ul>
                        </p>
                        <a href="{% url 'home_clientes' %}" class="btn btn-secondary">Volver a la Lista</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
