<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperación de contraseña</title>
</head>
<body style="margin: 0; padding: 24px; background-color: #f4f6f8; font-family: Arial, sans-serif;">
    <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        style="max-width: 600px; margin: auto; background-color: #ffffff;"
    >
        <tr>
            <td style="padding: 32px;">
                <h1 style="color: #0d6efd;">
                    Umeni repair services
                </h1>

                <p>
                    Hola {{ user.get_username }},
                </p>

                <p>
                    Recibimos una solicitud para cambiar la contraseña
                    de tu cuenta.
                </p>

                <p style="margin: 32px 0;">
                    <a
                        href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
                        style="display: inline-block; padding: 12px 20px; background-color: #0d6efd; color: #ffffff; text-decoration: none;"
                    >
                        Recuperar contraseña
                    </a>
                </p>

                <p>
                    Este enlace será válido durante 15 minutos.
                </p>

                <p>
                    Si no solicitaste este cambio, puedes ignorar este mensaje.
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
