{% extends 'base.html' %}

{% block title %}Asignar Vehículo a Cliente{% endblock %}

{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 border-bottom">
            <h3 class="h4 mb-0 fw-semibold">Asignar Vehículo a Cliente</h3>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-medium">Seleccionar Cliente</label>
                    {{ form.cliente }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Seleccionar Vehículo</label>
                    {{ form.vehiculo }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Observación / Nota</label>
                    {{ form.observacion }}
                </div>
                <div class="d-flex gap-2 mt-4 pt-2 border-top">
                    <button type="submit" class="btn btn-success px-4">Guardar Asignación</button>
                    <a href="{% url 'lista_clientes_vehiculos' %}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
